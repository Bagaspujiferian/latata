[PHP]
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 60
max_input_vars = 3000
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = Asia/Jakarta
cgi.fix_pathinfo = 0
